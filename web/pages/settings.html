<div class="grid grid-2 fade-in">
  <section class="panel">
    <div class="panel-header panel-header-red">
      <span>MODE</span>
     </span> <span class="panel-header-sub">what to grab</span>
    </div>
    <div class="panel-body">
      <label class="switch-row">
        <span class="switch-label">Audio-only export <code>-x</code></span>
        <input type="checkbox" class="switch" name="audio_export" data-setting
               hx-post="/api/settings/audio-export" hx-trigger="change"
               hx-swap="none" {{AUDIO_CHECKED}} />
      </label>

      <label class="switch-row">
        <span class="switch-label">Export thumbnails <code>--write-thumbnail</code></span>
       </code> <input type="checkbox" class="switch" name="thumbnail_export" data-setting
               hx-post="/api/settings/thumbnails" hx-trigger="change"
               hx-swap="none" {{THUMB_CHECKED}} />
      </label>

    </div>
  </section>

  <section class="panel">
    <div class="panel-header panel-header-orange">
      <span>FORMATS</span>
     </span> <span class="panel-header-sub">file types</span>
    </div>
    <div class="panel-body">
      <div class="field-row field-row-split">
        <div class="field">
          <label class="field-label" for="video-format">Video format</label>
          <div class="select-wrap">
            <select id="video-format" class="select" name="video_format" data-setting
                    hx-post="/api/settings/video-format" hx-trigger="change"
                    hx-swap="none">{{VIDEO_OPTIONS}}</select>
          </div>
        </div>
        <div class="field">
          <label class="field-label" for="audio-format">Audio format</label>
          <div class="select-wrap">
            <select id="audio-format" class="select" name="audio_format" data-setting
                    hx-post="/api/settings/audio-format" hx-trigger="change"
                    hx-swap="none">{{AUDIO_OPTIONS}}</select>
          </div>
        </div>
      </div>

    </div>
  </section>
</div>
